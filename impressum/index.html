const bin = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
async function show(raw) {
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(P.i) }, k, bin(P.c)));
  localStorage.setItem(S, P.s + ":" + btoa(String.fromCharCode(...raw)));
  document.open(); document.write(html); document.close();
}
// erst nach "load": solange die Passwortseite noch parst, würde document.write anhängen statt ersetzen
addEventListener("load", async () => {
  const [salt, k] = (localStorage.getItem(S) || "").split(":");
  if (salt === P.s) { try { return await show(bin(k)); } catch { localStorage.removeItem(S); } }
  document.documentElement.classList.remove("wait");
});
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Wird geprüft …";
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveBits"]);
  const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bin(P.s), iterations: P.n }, base, 256));
  try { await show(raw); } catch { err.textContent = "Falsches Passwort."; }
});
